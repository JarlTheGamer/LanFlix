<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Configuration - Lanflix</title>
  <link rel="stylesheet" href="../styles/settings.css">
</head>
<body>
  <div class="settings-container">
    <header class="settings-header">
      <button class="back-button" onclick="history.back()">← Back</button>
      <h1>App Configuration</h1>
    </header>

    <main class="settings-content">
      <section class="settings-section">
        <h2>Backend Server</h2>
        <p class="section-description">Configure the backend server URL for this device</p>
        
        <div class="setting-item">
          <label for="backend-url">Backend URL</label>
          <input 
            type="text" 
            id="backend-url" 
            placeholder="http://192.168.1.100:3000"
            class="setting-input"
          />
          <small>Enter your Lanflix backend server address (e.g., http://192.168.1.100:3000)</small>
        </div>

        <button id="test-connection" class="btn btn-secondary">Test Connection</button>
        <button id="save-config" class="btn btn-primary">Save Configuration</button>

        <div id="connection-status" class="status-message" style="display: none;"></div>
      </section>

      <section class="settings-section">
        <h2>Playback Settings</h2>
        
        <div class="setting-item">
          <label>
            <input type="checkbox" id="auto-play" />
            Auto-play next episode
          </label>
        </div>

        <div class="setting-item">
          <label for="quality">Default Quality</label>
          <select id="quality" class="setting-input">
            <option value="auto">Auto</option>
            <option value="1080p">1080p</option>
            <option value="720p">720p</option>
            <option value="480p">480p</option>
          </select>
        </div>

        <div class="setting-item">
          <label>
            <input type="checkbox" id="subtitles" />
            Enable subtitles by default
          </label>
        </div>
      </section>

      <section class="settings-section">
        <h2>About</h2>
        <div class="about-info">
          <p><strong>Version:</strong> 1.0.0</p>
          <p><strong>Platform:</strong> Android</p>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { appConfig } from '../modules/app-config.js';
    import apiClient from '../modules/api-client.js';

    // Load current configuration
    const config = appConfig.getAll();
    document.getElementById('backend-url').value = config.backendUrl;
    document.getElementById('auto-play').checked = config.autoPlay;
    document.getElementById('quality').value = config.quality;
    document.getElementById('subtitles').checked = config.subtitles;

    // Test connection
    document.getElementById('test-connection').addEventListener('click', async () => {
      const url = document.getElementById('backend-url').value.trim();
      const statusEl = document.getElementById('connection-status');
      
      if (!url) {
        showStatus('Please enter a backend URL', 'error');
        return;
      }

      showStatus('Testing connection...', 'info');

      try {
        const response = await fetch(`${url}/api/settings`, {
          method: 'HEAD',
          mode: 'cors'
        });

        if (response.ok) {
          showStatus('✓ Connection successful!', 'success');
        } else {
          showStatus(`✗ Connection failed (HTTP ${response.status})`, 'error');
        }
      } catch (error) {
        showStatus(`✗ Connection failed: ${error.message}`, 'error');
      }
    });

    // Save configuration
    document.getElementById('save-config').addEventListener('click', () => {
      const url = document.getElementById('backend-url').value.trim();
      
      if (!url) {
        showStatus('Please enter a backend URL', 'error');
        return;
      }

      // Save all settings
      appConfig.setBackendUrl(url);
      appConfig.set('autoPlay', document.getElementById('auto-play').checked);
      appConfig.set('quality', document.getElementById('quality').value);
      appConfig.set('subtitles', document.getElementById('subtitles').checked);

      // Update API client
      apiClient.setBaseURL(url);

      showStatus('✓ Configuration saved!', 'success');
      
      // Redirect to home after 1 second
      setTimeout(() => {
        window.location.href = '/pages/index.html';
      }, 1000);
    });

    function showStatus(message, type) {
      const statusEl = document.getElementById('connection-status');
      statusEl.textContent = message;
      statusEl.className = `status-message ${type}`;
      statusEl.style.display = 'block';
    }
  </script>

  <style>
    .status-message {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 4px;
      font-weight: 500;
    }

    .status-message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status-message.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      margin-right: 0.5rem;
      margin-top: 1rem;
    }

    .btn-primary {
      background: #e50914;
      color: white;
    }

    .btn-secondary {
      background: #333;
      color: white;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .about-info {
      padding: 1rem;
      background: #f5f5f5;
      border-radius: 4px;
    }

    .about-info p {
      margin: 0.5rem 0;
    }
  </style>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player - Flix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../styles/player.css">
  <link rel="stylesheet" href="../styles/syncplay-drawer.css">

  <!-- Google Cast SDK -->
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</head>

<body>
  <div class="player-container">
    <video id="video-player" class="video-element" playsinline webkit-playsinline preload="auto" autoplay
      crossorigin="anonymous"></video>
    <div id="player-controls" class="player-controls"></div>
    <button id="skip-intro-btn" class="skip-intro-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
      </svg>
      Skip Intro
    </button>
    <div id="next-episode-card" class="next-episode-card">
      <button id="next-episode-cancel-btn" class="next-episode-cancel-btn" title="Cancel Auto-Play">✕</button>
      <div class="next-episode-info">
        <span class="next-episode-label">Up Next in <strong id="next-episode-timer-text">5</strong>s</span>
        <span class="next-episode-title" id="next-episode-title-text">Next Episode</span>
      </div>
    </div>
    <button id="back-button" class="back-button" title="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </button>
  </div>

  <!-- Android "Open in App" smart banner (only shown on Android with syncRoom) -->
  <div id="android-app-banner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:99999;
      background: linear-gradient(135deg, #1a1a2e, #16213e); border-bottom: 1px solid rgba(229,9,20,0.4);
      padding: 12px 16px; align-items: center; gap: 12px; font-family: 'Poppins', sans-serif;">
    <div style="font-size: 1.6rem;">🍿</div>
    <div style="flex: 1;">
      <div style="color: #fff; font-weight: 700; font-size: 0.9rem; line-height: 1.2;">Open in Lanflix App</div>
      <div style="color: rgba(255,255,255,0.6); font-size: 0.75rem;">Better experience in the native app</div>
    </div>
    <a id="android-open-btn" href="#" style="background: linear-gradient(135deg, #e50914, #b20710); color: #fff;
        padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; text-decoration: none;
        white-space: nowrap; box-shadow: 0 4px 12px rgba(229,9,20,0.4);">Open App</a>
    <button id="android-banner-close" style="background: none; border: none; color: rgba(255,255,255,0.5);
        font-size: 1.2rem; cursor: pointer; padding: 4px 8px; line-height: 1;">✕</button>
  </div>
  <script>
    // Show "Open in App" banner on Android when visiting a Watch Party or player link
    (function () {
      const ua = navigator.userAgent || '';
      const isNativeApp = /Lanflix-AndroidApp|LanflixApp/i.test(ua) || typeof window.Android !== 'undefined';
      if (isNativeApp) return; // Already inside the native Android app — skip banner & deep link redirect

      const isAndroid = /Android/i.test(ua);
      if (!isAndroid) return;

      const params = new URLSearchParams(window.location.search);
      const contentId = params.get('contentId');
      const type = params.get('type') || 'movie';
      const episodeId = params.get('episodeId');
      const syncRoom = params.get('syncRoom');
      if (!contentId) return;

      const origin = encodeURIComponent(window.location.origin);
      const deepLink = `lanflix://player?contentId=${contentId}&type=${type}${episodeId ? `&episodeId=${episodeId}` : ''}${syncRoom ? `&syncRoom=${syncRoom}` : ''}&serverUrl=${origin}`;
      const intentUrl = `intent://player?contentId=${contentId}&type=${type}${episodeId ? `&episodeId=${episodeId}` : ''}${syncRoom ? `&syncRoom=${syncRoom}` : ''}&serverUrl=${origin}#Intent;scheme=lanflix;package=com.lanflix.webview;end;`;

      const banner = document.getElementById('android-app-banner');
      const openBtn = document.getElementById('android-open-btn');
      const closeBtn = document.getElementById('android-banner-close');

      if (banner && openBtn) {
        openBtn.href = intentUrl;
        openBtn.addEventListener('click', (e) => {
          try { window.location.href = deepLink; } catch (_) {}
        });
        banner.style.display = 'flex';
        closeBtn?.addEventListener('click', () => { banner.style.display = 'none'; });
      }
    })();
  </script>

  <script type="module">
    import VideoPlayer from '../modules/video-player.js';
    import apiClient from '../modules/api-client.js';
    import stateManager from '../modules/data.js';

    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const contentId = urlParams.get('contentId');
    const contentType = urlParams.get('type');
    const episodeId = urlParams.get('episodeId');
    const urlStartTime = urlParams.get('startTime'); // Check if start time is in URL

    if (!contentId || !contentType) {
      alert('Invalid player parameters');
      window.location.href = 'index.html';
    }

    // Get current profile from state manager
    let profileId = stateManager.currentProfileId;
    const syncRoom = urlParams.get('syncRoom');

    if (syncRoom) {
      // Watch Party join links MUST always switch to the Guest profile
      try {
        const profiles = await stateManager.getProfiles();
        const guestProfile = profiles.find(p => p.isGuest) || profiles.find(p => p.name?.toLowerCase().includes('guest')) || profiles[profiles.length - 1];
        if (guestProfile) {
          profileId = guestProfile.id;
          stateManager.currentProfileId = profileId;
          stateManager.saveState();
          console.log('🍿 Watch Party guest link: Force-switched to Guest profile ID', profileId);
        }
      } catch (err) {
        console.warn('Failed to load guest profile for Watch Party:', err);
      }
    }

    if (!profileId) {
      console.error('No profile selected, redirecting to profiles page');
      alert('Please select a profile first');
      window.location.href = 'profiles.html';
      throw new Error('No profile selected');
    }

    // Initialize video player
    const videoElement = document.getElementById('video-player');
    const player = new VideoPlayer(videoElement, profileId);

    // Get watch progress (unless start time is explicitly provided in URL or in Watch Party)
    let startPosition = 0;
    if (syncRoom) {
      console.log('🍿 Watch Party mode: Syncing position from host, ignoring personal history');
      startPosition = 0;
    } else if (urlStartTime) {
      // Use URL start time if provided (from Resume button)
      startPosition = parseInt(urlStartTime, 10);
      console.log('Using start time from URL:', startPosition);
    } else {
      // Otherwise, check for saved progress
      try {
        if (episodeId && contentType === 'series') {
          const history = await apiClient.getWatchHistory(profileId, 50);
          const episodeProgress = history.find(h => h.episodeId == episodeId);

          if (episodeProgress && !episodeProgress.isCompleted) {
            startPosition = episodeProgress.positionTicks ? Math.floor(episodeProgress.positionTicks / 10_000_000) : 0;
            console.log(`Loaded episode progress: ${startPosition}s`);
          }
        } else {
          const content = await apiClient.getLibraryItem(contentId, profileId);
          if (content && content.watchProgress && !content.watchProgress.completed) {
            startPosition = content.watchProgress.progressSeconds || 0;
            console.log('Loaded watch progress:', startPosition);
          }
        }
      } catch (error) {
        console.error('Failed to get watch progress:', error);
      }
    }

    // Initialize player
    await player.initialize(contentId, contentType, episodeId, startPosition);

    // Force play() after initialization
    try {
      await player.play();
    } catch (e) {
      console.warn('Auto-play failed:', e);
      if (syncRoom || (player.syncPlayClient && player.syncPlayClient.currentRoom)) {
        player.showGuestSyncOverlay();
      }
    }

    // Handle Auto-Play Next
    videoElement.addEventListener('ended', async () => {
      console.log('🎬 Video ended - checking for next episode...');
      if (contentType === 'episode' || contentType === 'series') {
        // Show loading toast
        const toast = document.createElement('div');
        toast.style.cssText = 'position: fixed; bottom: 80px; right: 40px; background: rgba(0,0,0,0.8); color: white; padding: 15px 25px; border-radius: 8px; z-index: 9999; font-family: "Poppins", sans-serif; display: flex; align-items: center; gap: 10px; border-left: 4px solid #e50914;';
        toast.innerHTML = '<span>Loading next episode...</span>';
        document.body.appendChild(toast);

        try {
          // We need seriesId to get the next episode. 
          // Ideally we passed it or can get it from content details.
          // If we don't have it, we try to fetch current content details.
          let currentSeriesId = new URLSearchParams(window.location.search).get('seriesId');

          if (!currentSeriesId) {
            const currentEp = await apiClient.getContent(contentId);
            if (currentEp) currentSeriesId = currentEp.seriesId;
          }

          if (currentSeriesId) {
            const nextEp = await apiClient.getNextEpisode(currentSeriesId, contentId);
            if (nextEp) {
              toast.innerHTML = `<span>Playing next: <strong>${nextEp.title}</strong></span>`;
              setTimeout(() => {
                window.location.href = `player.html?contentId=${nextEp.id}&type=episode&seriesId=${currentSeriesId}`;
              }, 2000);
              return;
            }
          }

          toast.innerHTML = '<span>No next episode found. Returning...</span>';
          setTimeout(() => window.history.back(), 2000);

        } catch (e) {
          console.warn('Auto-play failed:', e);
          toast.innerHTML = '<span>Auto-play failed. Returning...</span>';
          setTimeout(() => window.history.back(), 2000);
        }
      } else {
        // Movies just exit
        setTimeout(() => window.history.back(), 1000);
      }
    });

    // Setup TV remote control mapping
    setupTVRemoteControl();

    // Back button handler
    document.getElementById('back-button').addEventListener('click', async () => {
      await player.destroy();
      window.history.back();
    });

    // Setup TV remote control mapping
    function setupTVRemoteControl() {
      // Detect TV platforms
      const userAgent = navigator.userAgent.toLowerCase();
      const isFireTV = userAgent.includes('aftm') || userAgent.includes('aftb') || userAgent.includes('afts') || userAgent.includes('aftkmst12') || userAgent.includes('firetv');
      const isTV = isFireTV || userAgent.includes('googletv') || userAgent.includes('androidtv') || userAgent.includes('smarttv') || userAgent.includes('leanback');

      if (!isTV) return;

      console.log('🎮 Setting up TV remote control for player');

      // Fire TV specific key mappings
      const fireTVKeyMap = {
        'KEYCODE_DPAD_UP': 'ArrowUp',
        'KEYCODE_DPAD_DOWN': 'ArrowDown',
        'KEYCODE_DPAD_LEFT': 'ArrowLeft',
        'KEYCODE_DPAD_RIGHT': 'ArrowRight',
        'KEYCODE_DPAD_CENTER': 'Enter',
        'KEYCODE_BACK': 'Escape',
        'KEYCODE_MEDIA_PLAY': ' ',
        'KEYCODE_MEDIA_PAUSE': ' ',
        'KEYCODE_MEDIA_PLAY_PAUSE': ' ',
        'KEYCODE_MEDIA_STOP': 'Escape',
        'KEYCODE_MEDIA_FAST_FORWARD': 'ArrowRight',
        'KEYCODE_MEDIA_REWIND': 'ArrowLeft'
      };

      // Standard remote control mappings
      const remoteKeyMap = {
        'ArrowUp': 'ArrowUp',
        'ArrowDown': 'ArrowDown',
        'ArrowLeft': 'ArrowLeft',
        'ArrowRight': 'ArrowRight',
        'Enter': 'Enter',
        'Select': 'Enter',
        'OK': 'Enter',
        'Back': 'Escape',
        'Escape': 'Escape',
        'Backspace': 'Escape',
        'MediaPlay': ' ',
        'MediaPause': ' ',
        'MediaPlayPause': ' ',
        'MediaStop': 'Escape',
        'MediaTrackNext': 'ArrowRight',
        'MediaTrackPrevious': 'ArrowLeft'
      };

      // Handle remote control input
      document.addEventListener('keydown', (e) => {
        // Try Fire TV specific mapping first if on Fire TV
        let mappedKey = null;
        if (isFireTV) {
          mappedKey = fireTVKeyMap[e.code] || fireTVKeyMap[e.key];
        }

        // Fall back to standard mapping
        if (!mappedKey) {
          mappedKey = remoteKeyMap[e.key] || remoteKeyMap[e.code];
        }

        if (mappedKey && mappedKey !== e.key) {
          // Prevent the original event
          e.preventDefault();
          e.stopPropagation();

          console.log(`🎮 Player remote control: ${e.key}/${e.code} -> ${mappedKey}`);

          // Create a synthetic keyboard event
          const syntheticEvent = new KeyboardEvent('keydown', {
            key: mappedKey,
            code: mappedKey,
            bubbles: true,
            cancelable: true,
            composed: true
          });

          // Dispatch to the player navigation system
          setTimeout(() => {
            document.dispatchEvent(syntheticEvent);
          }, 0);
        }
      }, true);
    }

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      player.destroy();
    });
  </script>
</body>

</html>

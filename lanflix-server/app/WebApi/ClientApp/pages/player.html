<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player - Flix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../styles/player.css">

  <!-- Google Cast SDK -->
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</head>

<body>
  <div class="player-container">
    <video id="video-player" class="video-element" playsinline webkit-playsinline preload="auto"
      crossorigin="anonymous"></video>
    <div id="player-controls" class="player-controls"></div>
    <button id="back-button" class="back-button" title="Back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 12H5M5 12L12 19M5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </button>
  </div>

  <script type="module">
    import VideoPlayer from '../modules/video-player.js';
    import apiClient from '../modules/api-client.js';
    import stateManager from '../modules/data.js';

    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const contentId = urlParams.get('contentId');
    const contentType = urlParams.get('type');
    const episodeId = urlParams.get('episodeId');

    if (!contentId || !contentType) {
      alert('Invalid player parameters');
      window.location.href = 'index.html';
    }

    // Get current profile from state manager
    const profileId = stateManager.currentProfileId;

    if (!profileId) {
      console.error('No profile selected, redirecting to profiles page');
      alert('Please select a profile first');
      window.location.href = 'profiles.html';
      throw new Error('No profile selected');
    }

    // Initialize video player
    const videoElement = document.getElementById('video-player');
    const player = new VideoPlayer(videoElement, profileId);

    // Get watch progress
    let startPosition = 0;
    try {
      const content = await apiClient.getLibraryItem(contentId, profileId);
      if (content && content.watchProgress && !content.watchProgress.completed) {
        startPosition = content.watchProgress.progressSeconds || 0;
      }
    } catch (error) {
      console.error('Failed to get watch progress:', error);
    }

    // Initialize player
    await player.initialize(contentId, contentType, episodeId, startPosition);

    // Apply Fire TV specific styling early to prevent white screen
    applyEarlyFireTVFixes();

    // Setup TV remote control mapping
    setupTVRemoteControl();

    // Back button handler
    document.getElementById('back-button').addEventListener('click', () => {
      player.destroy();
      window.history.back();
    });

    // Setup TV remote control mapping
    function setupTVRemoteControl() {
      // Detect TV platforms
      const userAgent = navigator.userAgent.toLowerCase();
      const isFireTV = userAgent.includes('aftm') || userAgent.includes('aftb') || userAgent.includes('afts') || userAgent.includes('aftkmst12');
      const isTV = isFireTV || userAgent.includes('tv') || userAgent.includes('androidtv') || userAgent.includes('smarttv');

      if (!isTV) return;

      console.log('🎮 Setting up TV remote control for player');

      // Fire TV specific key mappings
      const fireTVKeyMap = {
        'KEYCODE_DPAD_UP': 'ArrowUp',
        'KEYCODE_DPAD_DOWN': 'ArrowDown',
        'KEYCODE_DPAD_LEFT': 'ArrowLeft',
        'KEYCODE_DPAD_RIGHT': 'ArrowRight',
        'KEYCODE_DPAD_CENTER': 'Enter',
        'KEYCODE_BACK': 'Escape',
        'KEYCODE_MEDIA_PLAY': ' ',
        'KEYCODE_MEDIA_PAUSE': ' ',
        'KEYCODE_MEDIA_PLAY_PAUSE': ' ',
        'KEYCODE_MEDIA_STOP': 'Escape',
        'KEYCODE_MEDIA_FAST_FORWARD': 'ArrowRight',
        'KEYCODE_MEDIA_REWIND': 'ArrowLeft'
      };

      // Standard remote control mappings
      const remoteKeyMap = {
        'ArrowUp': 'ArrowUp',
        'ArrowDown': 'ArrowDown',
        'ArrowLeft': 'ArrowLeft',
        'ArrowRight': 'ArrowRight',
        'Enter': 'Enter',
        'Select': 'Enter',
        'OK': 'Enter',
        'Back': 'Escape',
        'Escape': 'Escape',
        'Backspace': 'Escape',
        'MediaPlay': ' ',
        'MediaPause': ' ',
        'MediaPlayPause': ' ',
        'MediaStop': 'Escape',
        'MediaTrackNext': 'ArrowRight',
        'MediaTrackPrevious': 'ArrowLeft'
      };

      // Handle remote control input
      document.addEventListener('keydown', (e) => {
        // Try Fire TV specific mapping first if on Fire TV
        let mappedKey = null;
        if (isFireTV) {
          mappedKey = fireTVKeyMap[e.code] || fireTVKeyMap[e.key];
        }

        // Fall back to standard mapping
        if (!mappedKey) {
          mappedKey = remoteKeyMap[e.key] || remoteKeyMap[e.code];
        }

        if (mappedKey && mappedKey !== e.key) {
          // Prevent the original event
          e.preventDefault();
          e.stopPropagation();

          console.log(`🎮 Player remote control: ${e.key}/${e.code} -> ${mappedKey}`);

          // Create a synthetic keyboard event
          const syntheticEvent = new KeyboardEvent('keydown', {
            key: mappedKey,
            code: mappedKey,
            bubbles: true,
            cancelable: true,
            composed: true
          });

          // Dispatch to the player navigation system
          setTimeout(() => {
            document.dispatchEvent(syntheticEvent);
          }, 0);
        }
      }, true);
    }

    // Apply early Fire TV fixes to prevent white screen
    function applyEarlyFireTVFixes() {
      const userAgent = navigator.userAgent.toLowerCase();
      const isFireTV = userAgent.includes('aftm') || userAgent.includes('aftb') || userAgent.includes('afts');
      
      if (isFireTV) {
        console.log('🔥 Fire TV detected - applying early white screen prevention');
        
        // Add Fire TV class immediately
        document.body.classList.add('fire-tv-mode');
        
        // Force black backgrounds immediately
        document.body.style.backgroundColor = '#000000';
        document.documentElement.style.backgroundColor = '#000000';
        
        // Apply to player container
        const playerContainer = document.querySelector('.player-container');
        if (playerContainer) {
          playerContainer.style.backgroundColor = '#000000';
          playerContainer.style.background = '#000000';
        }
        
        // Apply to video element
        const videoElement = document.getElementById('video-player');
        if (videoElement) {
          videoElement.style.backgroundColor = '#000000';
          videoElement.style.background = '#000000';
          videoElement.style.opacity = '1';
          videoElement.style.visibility = 'visible';
        }
        
        // Inject early Fire TV CSS
        const earlyStyle = document.createElement('style');
        earlyStyle.innerHTML = `
          .fire-tv-mode,
          .fire-tv-mode * {
            background-color: #000000 !important;
          }
          .fire-tv-mode .player-container,
          .fire-tv-mode .video-element,
          .fire-tv-mode #video-player {
            background: #000000 !important;
            background-color: #000000 !important;
            opacity: 1 !important;
            visibility: visible !important;
          }
        `;
        document.head.appendChild(earlyStyle);
      }
    }

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      player.destroy();
    });
  </script>
</body>

</html>
